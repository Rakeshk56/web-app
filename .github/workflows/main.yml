
name: Java Maven CI

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven Build
        run: mvn clean package

      - name: Maven Test
        run: mvn test

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: java-application
          path: target/*.jar
